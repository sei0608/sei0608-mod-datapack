<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mod 配布ページ | sei0608の Minecraft Mod 配布サイト</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="sei0608が制作した Minecraft Mod の配布ページ。タグ検索・ローダー検索・バージョン履歴に対応。">
  <style>
  body {
    background-color: #000000;
    color: #ffffff;
    font-family: Arial, sans-serif;
  }
  a, nav a {
    color: #00bfff;
    text-decoration: none;
  }
  a:hover, nav a:hover {
    text-decoration: underline;
  }
  header, footer {
    background-color: #111111;
    padding: 1em;
  }
  button, .button {
    background-color: #00bfff;
    color: #000000;
    border: none;
    padding: 0.5em 1em;
    cursor: pointer;
    border-radius: 4px;
    font-weight: bold;
  }
  button:hover, .button:hover {
    background-color: #009acd;
  }
  nav ul {
    list-style: none;
    padding: 0;
    display: flex;
    gap: 1em;
  }
  nav li {
    display: inline;
  }
  </style>
</head>

<body>
  <header>
    <h1>Mod 配布ページ</h1>
    <nav>
      <ul>
        <li><a href="/sei0608-mod-datapack/">ホーム</a></li>
        <li><a href="/sei0608-mod-datapack/mods/">Mod</a></li>
        <li><a href="/sei0608-mod-datapack/datapacks/">データパック</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- 検索フォーム -->
    <section id="search">
      <h2>検索</h2>
      <label>タグで検索：</label>
      <input type="text" id="tag" placeholder="combat, utility など">

      <label>Mod ローダー：</label>
      <select id="loader">
        <option value="">すべて</option>
        <option value="Fabric">Fabric</option>
        <option value="Forge">Forge</option>
        <option value="NeoForge">NeoForge</option>
      </select>

      <button onclick="loadMods()">検索する</button>
    </section>

    <hr>

    <!-- 一覧表示 -->
    <section id="list">
      <h2>Mod 一覧</h2>
      <p>検索結果がここに表示されます。</p>
    </section>

  </main>

  <footer>
    <p>&copy; sei0608 / Minecraft Mod 配布サイト</p>
  </footer>

  <!-- JSON 読み込み & レンダリング -->
  <script>
    async function loadMods() {
      const res = await fetch("data.json");
      const mods = await res.json();

      const tag = document.getElementById("tag").value.trim();
      const loader = document.getElementById("loader").value;

      const filtered = mods.filter(m =>
        (tag === "" || m.tags.includes(tag)) &&
        (loader === "" || m.loader === loader)
      );

      render(filtered);
    }

    function render(list) {
      const container = document.getElementById("list");
      container.innerHTML = "<h2>Mod 一覧</h2>";

      if (list.length === 0) {
        container.innerHTML += "<p>該当する Mod がありません。</p>";
        return;
      }

      list.forEach(m => {
        const div = document.createElement("div");
        div.className = "mod-card";

        div.innerHTML = `
          <h3>${m.name}</h3>
          <p>${m.description}</p>
          <p><strong>Tags:</strong> ${m.tags.join(", ")}</p>
          <p><strong>Loader:</strong> ${m.loader}</p>

          <h4>バージョン履歴</h4>
          <ul>
            ${m.versions.map(v => `<li><a href="${v.file}">${v.version}</a></li>`).join("")}
          </ul>
        `;

        container.appendChild(div);
      });
    }

    // 初期表示
    loadMods();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>データパック詳細 | sei0608 の Minecraft 配布サイト</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="sei0608 が制作した Minecraft データパックの詳細ページ。バージョン履歴・説明・タグ・対応バージョンを掲載。">
  <style>
  body {
    background-color: #000000;
    color: #ffffff;
    font-family: Arial, sans-serif;
  }
  a, nav a {
    color: #00bfff;
    text-decoration: none;
  }
  a:hover, nav a:hover {
    text-decoration: underline;
  }
  header, footer {
    background-color: #111111;
    padding: 1em;
  }
  button, .button {
    background-color: #00bfff;
    color: #000000;
    border: none;
    padding: 0.5em 1em;
    cursor: pointer;
    border-radius: 4px;
    font-weight: bold;
  }
  button:hover, .button:hover {
    background-color: #009acd;
  }
  nav ul {
    list-style: none;
    padding: 0;
    display: flex;
    gap: 1em;
  }
  nav li {
    display: inline;
  }
  </style>
</head>

<body>
  <header>
    <h1>データパック詳細</h1>
    <nav>
      <ul>
        <li><a href="/sei0608-mod-datapack/">ホーム</a></li>
        <li><a href="/sei0608-mod-datapack/mods/">Mod 配布ページ</a></li>
        <li><a href="/sei0608-mod-datapack/datapacks/">データパック配布ページ</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="content">
      <h2 id="pack-name">読み込み中...</h2>
      <p id="pack-description"></p>

      <h3>タグ</h3>
      <p id="pack-tags"></p>

      <h3>バージョン履歴</h3>
      <ul id="pack-versions"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; sei0608 / Minecraft Datapack Distribution</p>
  </footer>

  <script>
    // URL の ?id=example_pack を取得
    const params = new URLSearchParams(window.location.search);
    const packId = params.get("id");

    async function loadPack() {
      const res = await fetch("data.json");
      const packs = await res.json();

      const pack = packs.find(p => p.id === packId);

      if (!pack) {
        document.getElementById("content").innerHTML =
          "<p>指定されたデータパックが見つかりません。</p>";
        return;
      }

      document.getElementById("pack-name").textContent = pack.name;
      document.getElementById("pack-description").textContent = pack.description;
      document.getElementById("pack-tags").textContent = pack.tags.join(", ");

      const versionList = document.getElementById("pack-versions");
      versionList.innerHTML = pack.versions
        .map(v => `<li>${v.mc_version} - <a href="${v.file}">${v.version}</a></li>`)
        .join("");
    }

    loadPack();
  </script>

</body>
</html>
